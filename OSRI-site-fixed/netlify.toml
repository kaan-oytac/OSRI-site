# Netlify settings.
#
# The .html files in this folder are what Netlify serves. They are produced by
# build.py on YOUR computer and committed alongside the sources, so Netlify
# does not run any build of its own. That is deliberate: a remote build is one
# more thing that can fail where you cannot see it, and a failed remote build
# means the site does not update at all.
#
# The trade-off: you must run build.bat before you push. If you forget, the
# live site simply shows the previous version until you do.

[build]
  publish = "."

# If you ever want to edit content directly on github.com, without a computer
# that has Python, uncomment the two lines below. Netlify will then run the
# build itself. Test one deploy straight afterwards to confirm it works.
#
# [build]
#   command = "python3 build.py"
#   publish = "."
