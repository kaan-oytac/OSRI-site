<!DOCTYPE html>
<!-- Source for assets/social.jpg, the picture shown when an osri.ca link is
     shared in a message, an email or on social media. It is NOT part of the
     site and is never linked from it.
     To change the card: edit this file, open it in a browser at exactly
     1200x630, and screenshot it to assets/social.jpg. -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Source+Sans+3:wght@400;600&display=swap">
<style>
  *{box-sizing:border-box;margin:0}
  body{width:1200px;height:630px;overflow:hidden;position:relative;
       background:#F9F9F6;font-family:"Source Sans 3",sans-serif}
  .photo{position:absolute;inset:0;background:url("assets/hero.jpg") center 58%/cover}
  .wash{position:absolute;inset:0;background:linear-gradient(100deg,
        rgba(249,249,246,.975) 0%,rgba(249,249,246,.965) 48%,
        rgba(249,249,246,.80) 64%,rgba(249,249,246,.44) 84%,rgba(249,249,246,.32) 100%)}
  .bar{position:absolute;top:0;left:0;right:0;height:14px;background:#A51C30}
  .inner{position:relative;padding:70px 70px 110px;height:100%;display:flex;
         flex-direction:column;justify-content:center}
  .row{display:flex;align-items:center;gap:24px;margin-bottom:30px}
  .row img{width:86px;height:auto}
  .eyebrow{font-size:19px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:#A51C30}
  h1{font-family:"Playfair Display",Georgia,serif;font-size:58px;line-height:1.08;
     color:#1A1A1A;max-width:15ch;font-weight:600}
  p{margin-top:26px;font-size:25px;line-height:1.45;color:#3A3A36;max-width:30ch}
  .foot{position:absolute;bottom:46px;left:70px;width:400px;
        border-top:1px solid #C9C9C2;padding-top:18px;
        font-size:21px;font-weight:600;letter-spacing:.06em;color:#A51C30}
</style></head><body>
  <div class="photo"></div><div class="wash"></div><div class="bar"></div>
  <div class="inner">
    <div class="row">
      <img src="assets/seal.png" alt="">
      <div class="eyebrow">Okanagan Student<br>Research Initiative</div>
    </div>
    <h1>Research reviewed and published by students.</h1>
    <p>Secondary school research in the Okanagan Valley. Free to authors.</p>
  </div>
  <div class="foot">osri.ca</div>
</body></html>
